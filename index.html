<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel@2.5.11/wasm/pyxel.js"></script>
    </head>

    <body>
        <pyxel-play root="." name="the-colors-development.pyxapp" packages="pygame-ce" gamepad="enabled"></pyxel-play>
        
        <script>
            // 強制的にオーディオコンテキストを生成・再開する関数
            function fixAudio() {
                // SDLの有無に関わらず、ブラウザレベルでオーディオを「活動状態」にする
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const tempCtx = new AudioContext();
                if (tempCtx.state === 'suspended') {
                    tempCtx.resume();
                }

                // SDLが存在する場合の処理
                if (typeof SDL !== 'undefined' && SDL.audio && SDL.audio.context) {
                    if (SDL.audio.context.state === 'suspended') {
                        SDL.audio.context.resume();
                    }
                }
            }

            // 2. ユーザーの最初のタッチ・クリックで実行（一度だけ）
            window.addEventListener('touchstart', fixAudio, { once: true });
            window.addEventListener('click', fixAudio, { once: true });
            
            const REDIRECT_URL = "https://github.com/Python-yarouze/the-colors";
            
            // ESCキーの監視（フォールバック用）
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    setTimeout(function() {
                        window.location.href = REDIRECT_URL;
                    }, 100);
                }
            });
        </script>
    </body>
</html>
