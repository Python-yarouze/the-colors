<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel@2.5.11/wasm/pyxel.js"></script>
    </head>

    <body>
        <pyxel-play root="." name="the-colors-development.pyxapp" packages="pygame-ce" gamepad="enabled"></pyxel-play>
        
        <script>
            // ページ内のどこかをタップした時にオーディオを再開させる
            window.addEventListener('touchstart', function() {
                if (typeof SDL !== 'undefined' && SDL.audio && SDL.audio.context) {
                    if (SDL.audio.context.state === 'suspended') {
                        SDL.audio.context.resume().then(() => {
                            console.log('AudioContext resumed!');
                        });
                    }
                }
            }, false);
            
            const REDIRECT_URL = "https://github.com/Python-yarouze/the-colors";
            
            // ESCキーの監視（フォールバック用）
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    setTimeout(function() {
                        window.location.href = REDIRECT_URL;
                    }, 100);
                }
            });
        </script>
    </body>
</html>
